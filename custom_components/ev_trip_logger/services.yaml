start_trip:
  name: Start trip
  description: Manually open a trip session.
  fields:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

end_trip:
  name: End trip
  description: Manually close the current trip session.
  fields:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

delete_last_trip:
  name: Delete last trip
  description: Remove the most recently logged trip (in case of accidental detection).
  fields:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

export_csv:
  name: Export CSV
  description: Dump the full trip history to a CSV file.
  fields:
    path:
      name: Path
      description: Absolute path of the CSV file to write.
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

log_charge:
  name: Log charge
  description: >-
    Record a charging session. Provide kWh added and either price per kWh or
    total cost — the other is derived. If neither is given, the home price
    from the integration config is used.
  fields:
    kwh:
      name: Energy added (kWh)
      description: Amount of energy added during this charge.
      required: true
      selector:
        number:
          min: 0.001
          max: 300
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    price_per_kwh:
      name: Price per kWh
      description: Use this if the charger shows a €/kWh rate. Leave empty to use home price.
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          mode: box
    total_cost:
      name: Total cost
      description: Use this if you only know the final amount paid. Overrides price per kWh.
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
    currency:
      name: Currency
      description: Currency code (defaults to integration setting).
      selector:
        text:
    location:
      name: Location
      description: Free text — e.g. home, work, Iberdrola Móstoles.
      selector:
        text:
    notes:
      name: Notes
      description: Optional notes (operator, plug type, etc.).
      selector:
        text:
          multiline: true
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

delete_last_charge:
  name: Delete last charge
  description: Remove the most recently logged charge.
  fields:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

set_last_charge_price:
  name: Set charge price
  description: >-
    Override price and/or location of an already-logged charge. Pass
    `charge_id` to target a specific older charge, or omit it to update
    the most-recent one. Useful when auto-detect saved a charge at the
    home tariff but you actually paid a public-charger rate — fix it on
    the fly from the dashboard. kWh and timestamp stay; price and total
    cost are recomputed.
  fields:
    price_per_kwh:
      name: Price per kWh
      description: New €/kWh rate.
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          mode: box
    total_cost:
      name: Total cost
      description: New total amount paid. Overrides price_per_kwh.
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
    location:
      name: Location
      description: Override the location (e.g. "Iberdrola Móstoles").
      selector:
        text:
    notes:
      name: Notes
      description: Override or append notes.
      selector:
        text:
          multiline: true
    charge_id:
      name: Charge ID
      description: >-
        Target a specific charge by id (visible in recent_charges
        attributes). Omit to update the most-recent charge.
      selector:
        number:
          min: 1
          step: 1
          mode: box
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

log_manual_trip:
  name: Log manual trip
  description: >-
    Backfill a trip that the live detector missed. Required: started_at,
    ended_at and either distance_km or both odometer bounds. Everything else
    is derived using the same formulas as a normal trip close.
  fields:
    started_at:
      name: Started at
      description: Local datetime when the trip started.
      required: true
      selector:
        datetime:
    ended_at:
      name: Ended at
      description: Local datetime when the trip ended.
      required: true
      selector:
        datetime:
    distance_km:
      name: Distance (km)
      description: Trip distance. Either this or odometer bounds are required.
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          mode: box
          unit_of_measurement: km
    odometer_start:
      name: Odometer at start (km)
      description: Use this when you know both odometer readings; distance is derived.
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    odometer_end:
      name: Odometer at end (km)
      description: Pair with odometer_start; distance = end − start.
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    soc_start:
      name: Battery at start (%)
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: "%"
    soc_end:
      name: Battery at end (%)
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: "%"
    max_power_kw:
      name: Max power (kW)
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
          unit_of_measurement: kW
    avg_temp_c:
      name: Avg. exterior temperature (°C)
      selector:
        number:
          min: -40
          max: 60
          step: 0.1
          mode: box
          unit_of_measurement: "°C"
    origin:
      name: Origin
      description: Free-text location label (e.g. home, work).
      selector:
        text:
    destination:
      name: Destination
      description: Free-text location label.
      selector:
        text:
    driver:
      name: Driver
      description: Who drove (free text, e.g. the person's name).
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

purge_trips:
  name: Purge trips
  description: >-
    Delete trips in a date range. At least one of `since` / `until` is required.
    Useful for cleaning up bad data — e.g. fragmented micro-trips left over
    from an earlier integration version.
  fields:
    since:
      name: Since
      description: Delete trips with started_at >= this datetime.
      selector:
        datetime:
    until:
      name: Until
      description: Delete trips with started_at <= this datetime.
      selector:
        datetime:
    entry_id:
      name: Entry ID
      description: Restrict the action to a specific config entry.
      selector:
        text:

set_trip:
  name: Set trip
  description: >-
    Amend any field on a logged trip. Useful to correct origin/destination
    that the device_tracker mis-reported, or fix timestamps when the integration
    closed late. Pass `trip_id` plus any field(s) to update.
  fields:
    trip_id:
      name: Trip ID
      description: ID of the trip row to patch (from sensor.<device>_recent_trips).
      required: true
      selector:
        number:
          min: 1
          mode: box
    started_at:
      name: Started at
      selector:
        datetime:
    ended_at:
      name: Ended at
      selector:
        datetime:
    distance_km:
      name: Distance (km)
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "km"
    energy_kwh:
      name: Energy (kWh)
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "kWh"
    soc_start:
      name: SoC start (%)
      selector:
        number:
          min: 0
          max: 100
          mode: box
    soc_end:
      name: SoC end (%)
      selector:
        number:
          min: 0
          max: 100
          mode: box
    origin:
      name: Origin
      selector:
        text:
    destination:
      name: Destination
      selector:
        text:
    driver:
      name: Driver
      description: Who drove (free text). Use to backfill or correct trips.
      selector:
        text:
    cost:
      name: Cost
      selector:
        number:
          min: 0
          mode: box
    journey_id:
      name: Journey ID
      selector:
        number:
          min: 1
          mode: box
    entry_id:
      name: Entry ID
      selector:
        text:

set_charge:
  name: Set charge
  description: >-
    Amend a charge's timestamps / kWh / SoC / location after the fact.
    Use this to fix auto-detected charges that got wrong timestamps
    (e.g. logged from a `now()` service call after the fact). kWh
    changes auto-recompute total_cost from the existing price_per_kwh.
  fields:
    charge_id:
      name: Charge ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    started_at:
      name: Started at
      selector:
        datetime:
    ended_at:
      name: Ended at
      selector:
        datetime:
    kwh:
      name: kWh
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "kWh"
    soc_start:
      name: SoC start (%)
      selector:
        number:
          min: 0
          max: 100
          mode: box
    soc_end:
      name: SoC end (%)
      selector:
        number:
          min: 0
          max: 100
          mode: box
    location:
      name: Location
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
    is_dcfc:
      name: Is DC fast-charge
      selector:
        boolean:
    entry_id:
      name: Entry ID
      selector:
        text:

recover_missing_trips:
  name: Recover missing trips
  description: >-
    Recovery mode: scan HA's recorder for odometer growth that ISN'T
    covered by any existing trip in [since, until], and insert
    synthetic records with confidence='reconstructed_recovery'.
    Existing trip rows are NEVER modified — recovery is purely
    additive. Best-effort SoC / origin / destination resolution from
    battery_level and device_tracker history at the boundaries.
  fields:
    since:
      name: Since
      description: Start of the recovery window. Older than the recorder retention (default ~10 days) will return nothing.
      required: true
      selector:
        datetime:
    until:
      name: Until
      description: End of the window. Defaults to "now" when omitted.
      selector:
        datetime:
    entry_id:
      name: Entry ID
      selector:
        text:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="EV Trip Logger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="targetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Subtle data-grid background (the "log" feel) -->
  <g stroke="#ffffff" opacity="0.06" stroke-width="1.5">
    <line x1="64"  y1="128" x2="448" y2="128"/>
    <line x1="64"  y1="256" x2="448" y2="256"/>
    <line x1="64"  y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64"  x2="128" y2="448"/>
    <line x1="256" y1="64"  x2="256" y2="448"/>
    <line x1="384" y1="64"  x2="384" y2="448"/>
  </g>

  <!-- Pulse halo at destination -->
  <circle cx="432" cy="104" r="80" fill="url(#targetGlow)"/>

  <!-- The route line — a curved trip from origin to destination -->
  <path d="M 80 408 C 180 360, 200 320, 248 286 S 360 200, 432 104"
        stroke="#ffffff"
        stroke-width="24"
        stroke-linecap="round"
        fill="none"
        opacity="0.96"
        filter="url(#softShadow)"/>

  <!-- Mid-trip data waypoints — small markers showing logged samples -->
  <circle cx="170" cy="362" r="13" fill="#0f172a"/>
  <circle cx="170" cy="362" r="8"  fill="#a7f3d0"/>
  <circle cx="252" cy="284" r="13" fill="#0f172a"/>
  <circle cx="252" cy="284" r="8"  fill="#a7f3d0"/>
  <circle cx="340" cy="208" r="13" fill="#0f172a"/>
  <circle cx="340" cy="208" r="8"  fill="#a7f3d0"/>

  <!-- Origin pin -->
  <circle cx="80" cy="408" r="32" fill="#a7f3d0"/>
  <circle cx="80" cy="408" r="20" fill="#0f172a"/>
  <circle cx="80" cy="408" r="8"  fill="#a7f3d0"/>

  <!-- Destination / current target — bullseye -->
  <circle cx="432" cy="104" r="38" fill="#a7f3d0"/>
  <circle cx="432" cy="104" r="26" fill="#0f172a"/>
  <circle cx="432" cy="104" r="14" fill="#5eead4"/>
  <circle cx="432" cy="104" r="5"  fill="#0f172a"/>
</svg>
